<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>推し活デコカメラ - Step 2 (修正版)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
      touch-action: none; /* ブラウザ全体の無用なズーム・スクロールを防止 */
    }

    .screen {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      z-index: 1;
      background-color: #000;
      flex-direction: column;
      justify-content: space-between;
    }

    .screen.active {
      display: flex;
    }

    /* --- 1. 撮影画面 --- */
    #screen-camera {
      position: relative;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* カメラプレビューコンテナ（全画面に白枠を配置） */
    .camera-viewport {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* カメラ映像：containに変更し、撮影エリアを厳密に一致させる */
    #camera-stream {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      transform-origin: center center;
    }

    .camera-mirrored {
      transform: scaleX(-1);
    }

    /* チェキ風オーバーレイフレーム（下部余白を半分程度に縮小：70px） */
    .cheki-frame-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      border-style: solid;
      border-color: #ffffff;
      border-top-width: 24px;
      border-left-width: 12px;
      border-right-width: 12px;
      border-bottom-width: 75px; /* 下部余白を現状の半分程度に変更 */
      box-shadow: inset 0 0 8px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 15px;
      z-index: 5;
    }

    .cheki-frame-overlay .frame-label {
      color: #aaa;
      font-size: 0.75rem;
      font-weight: bold;
      letter-spacing: 2px;
    }

    /* コントロールUI */
    .controls-top {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 30px 16px 12px 16px;
      z-index: 10;
    }

    .icon-btn {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #fff;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }

    .icon-btn.active {
      background: rgba(255, 51, 102, 0.8);
      border-color: #ff3366;
    }

    .controls-bottom {
      position: absolute;
      bottom: 12px;
      left: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      z-index: 10;
    }

    .shutter-btn {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: #fff;
      border: 5px solid #ff3366;
      box-shadow: 0 0 15px rgba(0,0,0,0.6);
      cursor: pointer;
    }

    .shutter-btn:active {
      transform: scale(0.92);
    }

    .zoom-container {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0, 0, 0, 0.6);
      padding: 4px 14px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
      font-size: 0.8rem;
    }

    .zoom-container input[type=range] {
      width: 120px;
      accent-color: #ff3366;
    }

    /* --- 2. プレビュー確認画面 --- */
    #screen-preview {
      background: #111;
      justify-content: space-between;
      align-items: center;
      padding-bottom: calc(16px + env(safe-area-inset-bottom));
    }

    .preview-wrapper {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      overflow: hidden;
    }

    #preview-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      box-shadow: 0 8px 25px rgba(0,0,0,0.8);
      border-radius: 4px;
    }

    .preview-actions {
      width: 100%;
      display: flex;
      justify-content: space-around;
      gap: 16px;
      padding: 0 20px;
    }

    .action-btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 28px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
    }

    .action-btn.secondary { background: #444; color: #fff; }
    .action-btn.primary { background: #ff3366; color: #fff; }
  </style>
</head>
<body>

  <!-- 1. 撮影画面 -->
  <div id="screen-camera" class="screen active">
    <div class="camera-viewport" id="viewport">
      <!-- カメラ映像 -->
      <video id="camera-stream" autoplay playsinline muted></video>

      <!-- チェキ風フレーム（下余白縮小版） -->
      <div class="cheki-frame-overlay">
        <div class="frame-label">推し活デコカメラ</div>
      </div>
    </div>

    <!-- 上部ボタン -->
    <div class="controls-top">
      <button id="btn-switch" class="icon-btn">🔄 切替 (イン)</button>
      <button id="btn-flash" class="icon-btn">⚡ ライト OFF</button>
    </div>

    <!-- 下部ボタン・スライダー -->
    <div class="controls-bottom">
      <div class="zoom-container">
        <span>🔍 ズーム</span>
        <input type="range" id="zoom-range" min="1" max="3" step="0.1" value="1">
        <span id="zoom-val">1.0x</span>
      </div>
      <button id="btn-shutter" class="shutter-btn"></button>
    </div>
  </div>

  <!-- 2. プレビュー確認画面 -->
  <div id="screen-preview" class="screen">
    <div class="preview-wrapper">
      <img id="preview-img" alt="撮影プレビュー">
    </div>

    <div class="preview-actions">
      <button id="btn-retake" class="action-btn secondary">撮り直す</button>
      <button id="btn-save-raw" class="action-btn primary">保存して次へ</button>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const video = document.getElementById('camera-stream');
      const viewport = document.getElementById('viewport');
      const btnSwitch = document.getElementById('btn-switch');
      const btnFlash = document.getElementById('btn-flash');
      const btnShutter = document.getElementById('btn-shutter');
      const zoomRange = document.getElementById('zoom-range');
      const zoomVal = document.getElementById('zoom-val');

      const screenCamera = document.getElementById('screen-camera');
      const screenPreview = document.getElementById('screen-preview');
      const previewImg = document.getElementById('preview-img');
      const btnRetake = document.getElementById('btn-retake');
      const btnSaveRaw = document.getElementById('btn-save-raw');

      let currentStream = null;
      let useFrontCamera = true;
      let isFlashOn = false;
      let currentZoom = 1.0;
      let zoomCapabilities = null;
      let capturedFrameData = null;

      // ピンチジェスチャー用変数
      let initialPinchDistance = null;
      let initialZoom = 1.0;

      async function startCamera() {
        if (currentStream) {
          currentStream.getTracks().forEach(track => track.stop());
        }

        const constraints = {
          video: {
            facingMode: useFrontCamera ? 'user' : 'environment',
            width: { ideal: 1080 },
            height: { ideal: 1920 }
          },
          audio: false
        };

        try {
          currentStream = await navigator.mediaDevices.getUserMedia(constraints);
          video.srcObject = currentStream;
          await video.play().catch(e => console.log('Auto-play handling:', e));

          const track = currentStream.getVideoTracks()[0];
          zoomCapabilities = track.getCapabilities ? track.getCapabilities().zoom : null;

          if (zoomCapabilities) {
            zoomRange.min = zoomCapabilities.min || 1;
            zoomRange.max = Math.min(zoomCapabilities.max || 4, 5);
            zoomRange.step = zoomCapabilities.step || 0.1;
          } else {
            zoomRange.min = 1;
            zoomRange.max = 3;
            zoomRange.step = 0.1;
          }

          if (useFrontCamera) {
            btnSwitch.textContent = '🔄 切替 (イン)';
          } else {
            btnSwitch.textContent = '🔄 切替 (アウト)';
          }

          isFlashOn = false;
          updateFlashUI();
          applyZoom(1.0);

        } catch (err) {
          console.error('カメラ起動エラー:', err);
          alert('カメラ起動失敗: ' + err.message);
        }
      }

      // ズーム適応処理 (ハードウェア ＋ CSSフォールバック)
      async function applyZoom(zoomValue) {
        currentZoom = Math.max(parseFloat(zoomRange.min), Math.min(zoomValue, parseFloat(zoomRange.max)));
        zoomRange.value = currentZoom;
        zoomVal.textContent = `${currentZoom.toFixed(1)}x`;

        if (!currentStream) return;
        const track = currentStream.getVideoTracks()[0];

        // ハードウェアズーム試行
        if (zoomCapabilities && track.applyConstraints) {
          try {
            await track.applyConstraints({ advanced: [{ zoom: currentZoom }] });
            video.style.transform = useFrontCamera ? 'scaleX(-1)' : 'none';
            return;
          } catch (e) {
            console.log('Hardware zoom failed, using CSS scale');
          }
        }

        // CSSズーム処理（反転と拡大を確実に同時適用）
        const mirror = useFrontCamera ? '-1' : '1';
        video.style.transform = `scale(${currentZoom}) scaleX(${mirror})`;
      }

      // タッチ操作によるピンチズーム処理
      viewport.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          e.preventDefault();
          initialPinchDistance = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          initialZoom = currentZoom;
        }
      }, { passive: false });

      viewport.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2 && initialPinchDistance) {
          e.preventDefault();
          const currentDistance = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          const factor = currentDistance / initialPinchDistance;
          applyZoom(initialZoom * factor);
        }
      }, { passive: false });

      viewport.addEventListener('touchend', (e) => {
        if (e.touches.length < 2) {
          initialPinchDistance = null;
        }
      });

      zoomRange.addEventListener('input', (e) => {
        applyZoom(parseFloat(e.target.value));
      });

      async function toggleFlash() {
        if (useFrontCamera) {
          alert('ライト機能はアウトカメラでのみ動作します。');
          return;
        }
        if (!currentStream) return;
        const track = currentStream.getVideoTracks()[0];
        const caps = track.getCapabilities ? track.getCapabilities() : {};

        if (!caps.torch) {
          alert('お使いの端末はライト制御に対応していません。');
          return;
        }

        try {
          isFlashOn = !isFlashOn;
          await track.applyConstraints({ advanced: [{ torch: isFlashOn }] });
          updateFlashUI();
        } catch (e) {
          alert('ライト切り替えエラー: ' + e.message);
        }
      }

      function updateFlashUI() {
        btnFlash.textContent = isFlashOn ? '⚡ ライト ON' : '⚡ ライト OFF';
        btnFlash.classList.toggle('active', isFlashOn);
      }

      // 撮影＆チェキ合成（見た目の表示エリアと100%一致させてトリミング）
      function captureChekiPhoto() {
        const canvas = document.createElement('canvas');
        canvas.width = 1080;
        canvas.height = 1920;
        const ctx = canvas.getContext('2d');

        // 白フレーム背景
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, 1080, 1920);

        // 写真エリア計算（下余白縮小に対応）
        const photoX = 36;
        const photoY = 70;
        const photoW = 1008;
        const photoH = 1550; // 下余白を小さくし写真サイズを拡大

        // Videoの画角そのまま切り出し
        const vCanvas = document.createElement('canvas');
        vCanvas.width = video.videoWidth || 1080;
        vCanvas.height = video.videoHeight || 1920;
        const vCtx = vCanvas.getContext('2d');

        if (useFrontCamera) {
          vCtx.translate(vCanvas.width, 0);
          vCtx.scale(-1, 1);
        }
        vCtx.drawImage(video, 0, 0, vCanvas.width, vCanvas.height);

        // プレビュー表示範囲と100%同じ構図でクロップ合成
        ctx.drawImage(vCanvas, 0, 0, vCanvas.width, vCanvas.height, photoX, photoY, photoW, photoH);

        // 下部ロゴテキスト
        ctx.fillStyle = '#AAAAAA';
        ctx.font = 'bold 28px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('推し活デコカメラ', 1080 / 2, 1820);

        capturedFrameData = canvas.toDataURL('image/png');
        previewImg.src = capturedFrameData;

        screenCamera.classList.remove('active');
        screenPreview.classList.add('active');
      }

      btnSwitch.addEventListener('click', () => {
        useFrontCamera = !useFrontCamera;
        startCamera();
      });

      btnFlash.addEventListener('click', toggleFlash);
      btnShutter.addEventListener('click', captureChekiPhoto);

      btnRetake.addEventListener('click', () => {
        screenPreview.classList.remove('active');
        screenCamera.classList.add('active');
      });

      btnSaveRaw.addEventListener('click', () => {
        if (capturedFrameData) {
          const album = JSON.parse(localStorage.getItem('cheki_album') || '[]');
          album.unshift({
            id: Date.now(),
            type: 'raw',
            dataUrl: capturedFrameData,
            date: new Date().toLocaleString()
          });
          localStorage.setItem('cheki_album', JSON.stringify(album));
          alert('撮影データ（未デコ）を保存しました！');
        }
        screenPreview.classList.remove('active');
        screenCamera.classList.add('active');
      });

      startCamera();
    });
  </script>
</body>
</html>
